[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wattbench"
version = "0.1.0"
description = "GPU performance-per-watt measurement harness with dual-source power validation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "WattBench" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pynvml>=11.5",
    "pyserial>=3.5",
    "pydantic>=2.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
wattbench = "wattbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wattbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:pynvml",
    "ignore:.*pynvml.*:FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]
ignore = ["E501", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
files = ["src/wattbench"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
disallow_untyped_defs = false

[tool.coverage.run]
source = ["wattbench"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
