name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit and integration tests with coverage
        run: pytest -q --cov=wattbench --cov-report=term --cov-report=xml

      - name: End-to-end smoke sweep, analysis, report
        run: |
          wattbench sweep --config config/ci_smoke.yaml --out runs/ci-smoke
          wattbench analyze runs/ci-smoke --out results
          wattbench report runs/ci-smoke
          wattbench compare --baseline runs/ci-smoke --candidate runs/ci-smoke

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wattbench-results-py${{ matrix.python-version }}
          path: |
            results/
            runs/ci-smoke/results/
          if-no-files-found: warn
